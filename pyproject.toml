[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mltool"
version = "0.1.0"
description = "A CLI for preparing and comparing tabular ML experiments"
requires-python = ">=3.12"
dependencies = [
    "autogluon.tabular[lightgbm,catboost,xgboost]>=1.6,<1.7",
    "cloudpickle>=3,<4",
    "pandas>=2.2,<3.0",
    "pyarrow>=23,<25",
    "PyYAML>=6,<7",
    "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
mltool = "mltool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
